name: CI

on:
    pull_request:
    push:
        branches:
            - master
        tags:
            - 'v*'

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.13
            - run: bun install --frozen-lockfile
            - run: bun run test:setup --with-deps
            - run: bun run lint
            - run: bun run check
            - run: bun run test
            - run: bun run build

    release:
        if: startsWith(github.ref, 'refs/tags/v')
        needs: validate
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.13
            - run: bun install --frozen-lockfile
            - name: Verify tag matches package version
              run: test "${GITHUB_REF_NAME}" = "v$(bun -p "require('./package.json').version")"
            - run: bun run zip
            - uses: actions/upload-artifact@v4
              with:
                  name: instagram-client-reels-${{ github.ref_name }}
                  path: .output/*.zip
                  if-no-files-found: error
            - uses: softprops/action-gh-release@v2
              with:
                  files: .output/*.zip
                  generate_release_notes: true
